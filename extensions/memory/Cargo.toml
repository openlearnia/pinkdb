[package]
name = "pinkdb-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent memory for pinkdb (wave 109): conversation turns, distilled atoms, scenarios and a persona, with per-caller visibility and budgeted retrieval"
license = "MIT"
publish = false

[lib]
# A cdylib is what `LOAD EXTENSION '<path>/libpinkdb_memory.dylib'` loads; the
# rlib lets the CLI, the agent and this crate's own tests use the same code
# without a dynamic library.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The ABI + safe Rust surface: the dot command (minor 4) and the served
# protocol (minor 2), the same two the agent and MCP extensions use.
pinkdb-ext-sdk = { path = "../../ext-sdk/rust" }
# The warehouse tool table: a client connected to memory still sees `query`,
# `describe`, … so memory is one bridge, not a second store to learn.
pinkdb-warehouse-tools = { path = "../warehouse-tools" }
# The MCP wire, shared with the MCP bridge (wave 105).
pinkdb-mcp-protocol = { path = "../mcp-protocol" }
# The shared model client (wave 106b): distillation is a model call, and the
# provider table, the keys and the wire protocols live there, not here.
pinkdb-llm = { path = "../llm" }
# Statements, rows and the model's JSON answers are JSON.
serde_json = "1"

[dev-dependencies]
# The engine: the storage, visibility and end-to-end tests run against a real
# store (and a real `Connection` for the ACL cases), not a fake SQL engine.
pinkdb = { path = "../../crates/pinkdb" }
# The host trait the server's own `SessionHost` implements, so a test drives
# the same public/internal channel the CLI and the server do.
pinkdb-ext-loader = { path = "../../crates/pinkdb-ext-loader" }
# The embeddings package the hybrid-retrieval test loads into the store.
pinkdb-embeddings = { path = "../embeddings" }
