[package]
name = "pinkdb-datetime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb core datetime extension: strftime, strptime, epoch, epoch_ms, dayofweek, dayofyear, week, last_day, age, make_date (naive timestamps)"
license = "MIT"

[dependencies]
# The wave-51 Rust SDK: one `pinkdb_extension!` declaration generates the
# shared function list and the linked/wasm registration the CLI and embedders
# publish at bootstrap. This crate is linked-only (an rlib inside the host
# binary), so it does not emit the native ABI exports — see the crate docs.
# The SDK depends on the loader, never the other way around; this crate adds no
# other dependency (calendar math and the format engine are hand rolled below).
pinkdb-ext-sdk = { path = "../../ext-sdk/rust" }

[dev-dependencies]
# End-to-end SQL tests (tests/engine.rs) drive the extension through the
# engine: binder, executor, WAL. A dev-dependency cannot cycle — the engine
# never depends on this crate.
pinkdb = { path = "../../crates/pinkdb" }
