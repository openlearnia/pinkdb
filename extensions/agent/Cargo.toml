[package]
name = "pinkdb-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The pinkdb data agent: a model that answers questions by running warehouse tools against the store (ABI minor 4 command extension)"
license = "MIT"

[lib]
# A cdylib is what `LOAD EXTENSION '<path>/libpinkdb_agent.dylib'` loads (and
# what `.agent` dispatches to); the rlib lets the tests drive the loop, the
# provider and the store without a host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The ABI + safe Rust surface: the command entry point, the statement
# callbacks and the output sink.
pinkdb-ext-sdk = { path = "../../ext-sdk/rust" }
# The warehouse tool set (wave 106), shared with the MCP bridge: same JSON
# schemas, same statements, same dispatch to the host.
pinkdb-warehouse-tools = { path = "../warehouse-tools" }
# The model client (wave 106b): the transcript, the provider registry and the
# two wire protocols, shared with the agent-memory extension. It owns the only
# third-party dependency the agent has (blocking `ureq` with rustls).
pinkdb-llm = { path = "../llm" }
# The transcript and the tool arguments are JSON; serde_json is already in the
# workspace, so this adds no new external crate.
serde_json = "1"
