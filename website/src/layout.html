<script data-theme-script>
/* Theme: follows the OS until the visitor picks one; the choice is kept in
   localStorage and applied before first paint. Without JS the controls stay
   hidden and the page simply follows prefers-color-scheme. */
(function () {
  var KEY = "pinkdb-theme";
  var root = document.documentElement;
  var media = window.matchMedia("(prefers-color-scheme: dark)");
  var mode = "system";
  try {
    var saved = localStorage.getItem(KEY);
    if (saved === "light" || saved === "dark") mode = saved;
  } catch (e) {}

  function effective() { return mode === "system" ? (media.matches ? "dark" : "light") : mode; }

  function apply() {
    if (mode === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    var dark = effective() === "dark";
    var toggles = document.querySelectorAll("[data-theme-toggle]");
    for (var i = 0; i < toggles.length; i++) {
      toggles[i].setAttribute("aria-pressed", String(dark));
      toggles[i].setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      toggles[i].title = dark ? "Switch to light theme" : "Switch to dark theme";
    }
    var choices = document.querySelectorAll("[data-theme-choice]");
    for (var j = 0; j < choices.length; j++) {
      choices[j].setAttribute("aria-pressed", String(choices[j].getAttribute("data-theme-choice") === mode));
    }
  }

  function choose(next) {
    mode = next;
    try {
      if (mode === "system") localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, mode);
    } catch (e) {}
    // Switch in one frame: no per-element colour transitions.
    root.classList.add("theme-switching");
    apply();
    void root.offsetWidth;
    requestAnimationFrame(function () { root.classList.remove("theme-switching"); });
  }

  apply();
  if (media.addEventListener) media.addEventListener("change", apply);

  document.addEventListener("DOMContentLoaded", function () {
    var controls = document.querySelectorAll("[data-theme-toggle], .theme-switch");
    for (var i = 0; i < controls.length; i++) controls[i].hidden = false;
    document.addEventListener("click", function (event) {
      var target = event.target.closest("[data-theme-toggle], [data-theme-choice]");
      if (!target) return;
      if (target.hasAttribute("data-theme-toggle")) choose(effective() === "dark" ? "light" : "dark");
      else choose(target.getAttribute("data-theme-choice"));
    });
    apply();
  });
})();
</script>
</head>
<body>

  </div>
