# Cloudflare Workers static-assets configuration for the pinkdb docs.
# Build the site first (python3 build.py), then deploy from this directory:
#   wrangler deploy
# Validate without deploying:
#   wrangler deploy --dry-run --outdir /tmp/pinkdb_docs_dry

name = "pinkdb-docs"
compatibility_date = "2026-10-13"

[assets]
directory = "./public"
# Internal links are generated extensionless (build.py rewrites .html
# hrefs), which is what Workers' default html_handling serves canonically;
# missing paths use the generated 404.html.
not_found_handling = "404-page"
