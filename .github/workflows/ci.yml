# pinkdb CI — build, tests, clippy, feature matrix, bindings, SDK smokes, S3.
#
# Runs on pushes to main and on every pull request. GitHub-hosted runners
# only. Nothing here publishes: that is `publish-extensions.yml`
# (workflow_dispatch), and docs deploy is `deploy-docs.yml` (push to main
# touching website/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# One run per ref; a new push supersedes an in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core workspace: build, the full test suite, clippy, the feature matrix
  # that matters (S3 / lake / encryption), the wasm check, and the release
  # CLI artifact the duckdiff job consumes.
  build-test:
    name: build, test, clippy, features, wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: default

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test -q

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Feature matrix: the combinations that change runtime behavior.
      - name: cargo test -p pink-lake --features s3
        run: cargo test -p pink-lake --features s3

      - name: cargo test -p pinkdb-cli --features lake,s3
        run: cargo test -p pinkdb-cli --features lake,s3

      - name: cargo test -p pinkdb-cli --features encryption
        run: cargo test -p pinkdb-cli --features encryption

      - name: cargo test -p pinkdb --features encryption
        run: cargo test -p pinkdb --features encryption

      - name: cargo test -p pinkdb-cli --features client
        run: cargo test -p pinkdb-cli --features client

      - name: cargo test -p pinkdb-cli --features repo
        run: cargo test -p pinkdb-cli --features repo

      - name: cargo clippy, feature sets (-D warnings)
        run: |
          cargo clippy --all-targets -p pinkdb --features encryption -- -D warnings
          cargo clippy --all-targets -p pink-lake --features s3 -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features lake,s3,repo,client,encryption -- -D warnings

      # SIGKILL crash-recovery loops against the dev CLI (plain, multi-db,
      # kill-during-checkpoint, encrypted).
      - name: kill loops (bench/kill_loop.py)
        env:
          PINKDB_KEY: ci-kill-loop-passphrase
        run: |
          cargo build -p pinkdb-cli
          python3 bench/kill_loop.py 20
          python3 bench/kill_loop.py 20 --multi-db
          python3 bench/kill_loop.py --targeted 10
          cargo build -p pinkdb-cli --features encryption
          python3 bench/kill_loop.py 15 --encrypted

      - name: wasm check (the core must stay wasm32-compatible)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p pinkdb --target wasm32-unknown-unknown

      - name: cargo build --release -p pinkdb-cli (duckdiff artifact)
        run: cargo build --release -p pinkdb-cli

      - name: upload the release CLI for the duckdiff job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinkdb-cli-release
          path: target/release/pinkdb
          if-no-files-found: error

  # Differential test against DuckDB. Reuses the release CLI built by
  # `build-test` (downloaded from the artifact) instead of rebuilding it
  # here; `--big <csv>` enables the 1M-row battery locally.
  duckdiff:
    name: differential vs DuckDB
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: download the release CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinkdb-cli-release
          path: target/release

      # Artifacts do not reliably carry the executable bit.
      - name: make the CLI executable
        run: chmod +x target/release/pinkdb

      - name: install the DuckDB CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -q -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install -m 0755 /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: python3 bench/duckdiff.py
        run: python3 bench/duckdiff.py

  # C ABI down to both language bindings: Python (ctypes) and Go (cgo).
  bindings:
    name: python + go bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bindings

      - name: cargo build --release -p pinkdb-ffi
        run: cargo build --release -p pinkdb-ffi

      - name: C ABI example (make -C crates/pinkdb-ffi hello)
        run: make -C crates/pinkdb-ffi hello

      - name: python3 -m unittest discover -s bindings/python/tests
        run: python3 -m unittest discover -s bindings/python/tests -v

      - name: install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bindings/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      - name: go vet + go test -race ./...
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  # The two extension SDKs, end to end: each smoke script builds the release
  # CLI and runs a deterministic LOAD EXTENSION session against the compared
  # examples (C/C++ and Go).
  sdk-smokes:
    name: extension SDK smokes (C/C++ and Go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: sdk-smokes

      - name: install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ext-sdk/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      # Pre-build once so both smoke scripts hit a warm target/ (they build
      # the release CLI themselves, so this is a no-op for them).
      - name: cargo build --release -p pinkdb-cli
        run: cargo build --release -p pinkdb-cli

      - name: make -C ext-sdk/c
        run: make -C ext-sdk/c

      - name: ./ext-sdk/c/smoke.sh
        run: ./ext-sdk/c/smoke.sh

      - name: ./ext-sdk/go/smoke.sh
        run: ./ext-sdk/go/smoke.sh

  # Real S3 semantics in a container (adobe/s3mock pulled from Docker Hub):
  # round-trip, concurrency races and refusals through the release CLI.
  # continue-on-error is intentionally unset (false): this is a hard gate.
  s3-docker:
    name: S3 round-trip/race (s3mock in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lake-s3

      - name: cargo build --release -p pinkdb-cli --features lake,s3
        run: cargo build --release -p pinkdb-cli --features lake,s3

      - name: crates/pink-lake/tests/s3_docker.sh
        run: SKIP_BUILD=1 crates/pink-lake/tests/s3_docker.sh

  # macOS (arm64) is the development platform and the only published
  # extension platform today: run the core suites there too.
  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test -p pinkdb-cli --features lake,s3
        run: cargo test -p pinkdb-cli --features lake,s3

      - name: cargo test -p pinkdb --features encryption
        run: cargo test -p pinkdb --features encryption

      - name: python binding on macOS
        run: |
          cargo build --release -p pinkdb-ffi
          python3 -m unittest discover -s bindings/python/tests -v

  # Declared minimum Rust versions: 1.89 for the core crates (std file
  # locking), 1.95 for pink-lake (the vortex dependency's own floor).
  msrv:
    name: MSRV (1.89 core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust 1.89
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.89"

      - name: cargo check (default features, core crates)
        run: cargo check -p pinkdb -p pinkdb-cli -p pinkdb-server -p pinkdb-ffi -p pinkdb-ext-loader

  # Known-vulnerability scan of Cargo.lock (RustSec advisory database).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: cargo install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # The docs site must keep building on every change (deploy-docs only runs
  # on main).
  docs:
    name: docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: python3 website/build.py
        run: python3 website/build.py

      - name: roadmap page matches ROADMAP.md
        run: python3 website/tools/sync_roadmap.py --check
