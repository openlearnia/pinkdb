# pinkdb CI — build, tests, clippy, feature matrix, bindings, SDK smokes, S3.
#
# Runs on pushes to main and on every pull request. GitHub-hosted runners
# only. Nothing here publishes: that is `publish-extensions.yml`
# (workflow_dispatch), and docs deploy is `deploy-docs.yml` (push to main
# touching website/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# One run per ref; a new push supersedes an in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core: formatting, the default workspace test suite, and the SIGKILL
  # crash-recovery loops. The feature matrices run in `feature-tests` so each
  # family gets its own runner instead of sharing one serial job.
  core:
    name: core tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        # The extension cdylibs are built here because the CLI's end-to-end
        # tests load the real libraries (tests/mcp.rs, tests/agent_run.rs,
        # tests/memory_run.rs); the extensions' own tests run in the same
        # workspace test pass.
        run: cargo build -p pinkdb-cli -p pinkdb-mcp -p pinkdb-agent -p pinkdb-memory

      - name: cargo test -p pinkdb-llm
        # The shared model client (wave 106b): both wire protocols against
        # recorded fixtures on 127.0.0.1, the registry and key isolation. Its
        # own step so a provider regression is named in the CI summary.
        run: cargo test -q -p pinkdb-llm

      - name: cargo test -p pinkdb-memory
        # Agent memory (wave 109): distillation against a scripted provider, the
        # four visibility classes over real users and roles, the retrieval
        # budgets, supersession and the key sentinel. Its own step so a memory
        # regression is named in the CI summary.
        run: cargo test -q -p pinkdb-memory

      - name: cargo test
        run: cargo test -q

      # SIGKILL crash-recovery loops against the dev CLI (plain, multi-db,
      # kill-during-checkpoint, encrypted).
      - name: kill loops (bench/kill_loop.py)
        run: |
          cargo build -p pinkdb-cli
          python3 bench/kill_loop.py 20
          python3 bench/kill_loop.py 20 --multi-db
          python3 bench/kill_loop.py --targeted 10
          cargo build -p pinkdb-cli --features encryption
          # Scope the passphrase to this one invocation: an ambient
          # PINKDB_KEY would otherwise encrypt the plain runs' checkpoints.
          PINKDB_KEY=ci-kill-loop-passphrase python3 bench/kill_loop.py 15 --encrypted

  # Feature matrix: split by feature family so lake/CLI/server suites run on
  # separate runners. Every entry shares the same rust-cache key, so a runner
  # that restores a cache built by another entry only recompiles the missing
  # feature artifacts.
  feature-tests:
    name: feature tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lake
            run: |
              cargo test -p pink-lake --features s3
              cargo test -p pink-lake --features s3,encryption
              cargo test -p pink-lake --features catalog-sqlite
              cargo test -p pink-lake --features catalog-sqlite,s3,encryption
              cargo test -p pink-lake --features catalog-s3,encryption
              cargo test -p pink-lake --test replication_catalogs
              cargo test -p pink-lake --features catalog-sqlite --test replication_catalogs
          - name: cli-lake
            run: |
              cargo test -p pinkdb-cli --features pinklake
              cargo test -p pinkdb-cli --features pinklake,s3
              cargo test -p pinkdb-cli --features pinklake,s3,encryption
              cargo test -p pinkdb-cli --features s3
              cargo test -p pinkdb-cli --features pinklake,s3,catalog-sqlite
              cargo test -p pinkdb-cli --features pinklake,s3,catalog-s3
              # Parquet-format lakes through the CLI: three of these tests went
              # stale after wave 103 because no job built `parquetlake` (wave 98c).
              cargo test -p pinkdb-cli --features pinklake,s3,parquetlake
              # The default build must never link SQLite or Postgres (wave 96a).
              ! cargo tree -p pinkdb-cli -e normal | grep -qE "postgres|rusqlite"
          - name: cli-misc
            run: |
              cargo test -p pinkdb-cli --features encryption
              # The iceberg reader (wave 72): its fixtures and its local reads,
              # then the same tables through the mock S3 transport. The DuckDB
              # oracle cases self-skip here (no reference binary on the runner).
              cargo test -p pinkdb-iceberg
              cargo test -p pinkdb-iceberg --features remote
              cargo test -p pinkdb-cli --features iceberg
              cargo test -p pinkdb --features encryption
              cargo test -p pinkdb-cli --features client
              cargo test -p pinkdb-cli --features client,tls
              cargo test -p pinkdb-cli --features repo
          - name: js
            run: |
              cargo test -p pinkdb-js
              cargo test -p pinkdb-js --features engine
              cargo test -p pinkdb --features js
              cargo test -p pinkdb-cli --features js
              # The default build must never link the engine.
              ! cargo tree -p pinkdb-cli -e normal | grep -q rquickjs
          - name: server
            run: |
              cargo test -p pinkdb-server --features tls
              cargo test -p pinkdb-server --features async-server
              cargo test -p pinkdb-server --features ui
              cargo test -p pinkdb-server --features ui,tls
              # Wave 121b: imports (CSV/Parquet readers) and the console over
              # lake catalogs (.pink, SQLite) with S3 data on the mock.
              cargo test -p pinkdb-server --features ui,parquet,httpfs,catalog-sqlite,lake-s3
              ! cargo tree -p pinkdb-server | grep -q tokio
              ! cargo tree -p pinkdb-server -e normal | grep -qE "pinkdb-parquet|pinkdb-httpfs"
          - name: vss
            run: |
              cargo test -p pinkdb-vss
              cargo test -p pinkdb-cli --features vss
              cargo test -p pinkdb-server --features vss
              # The HNSW index is opt-in; the default binary must not link it.
              ! cargo tree -p pinkdb-cli -e normal | grep -q pinkdb-vss
          - name: fts
            run: |
              cargo test -p pinkdb-fts
              cargo test -p pinkdb-cli --features fts
              cargo test -p pinkdb-cli --features fts-regex
              cargo test -p pinkdb-server --features fts
              # Full-text search is opt-in, and its default tokenizer must not
              # pull in `regex` (the CLI links `regex` anyway, through the
              # string extension's regexp functions: no path may run via fts).
              ! cargo tree -p pinkdb-cli -e normal | grep -q pinkdb-fts
              ! cargo tree -p pinkdb-cli -e normal --features fts -i regex | grep -q pinkdb-fts
          - name: embeddings
            run: |
              cargo test -p pinkdb-embeddings
              cargo test -p pinkdb-cli --features embeddings
              cargo test -p pinkdb-server --features embeddings
              # Embeddings are opt-in (wave 107c), and the default binary must
              # link neither the package nor the blocking HTTPS client it uses.
              ! cargo tree -p pinkdb-cli -e normal | grep -q pinkdb-embeddings
              ! cargo tree -p pinkdb-cli -e normal | grep -q ureq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: ${{ matrix.name }} feature tests
        run: ${{ matrix.run }}

  # The Postgres catalog (wave 96a) needs a real server: this job runs the
  # shared catalog suite against a throwaway `postgres:17` service and the
  # env-gated CLI test. Every test allocates a fresh schema and drops it.
  catalog-postgres:
    name: catalog (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Distinctive, so the tests can check it never reaches the output
          # (the word "postgres" is in every URL).
          POSTGRES_PASSWORD: pinkdb-ci-s3cret
          POSTGRES_DB: pinktest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PINKDB_TEST_POSTGRES_URL: postgres://postgres:pinkdb-ci-s3cret@127.0.0.1:5432/pinktest?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: Postgres catalog suite (the backend alone)
        run: cargo test -p pink-lake --features catalog-postgres

      - name: Postgres catalog suite (every catalog feature)
        run: cargo test -p pink-lake --features catalog-postgres,catalog-sqlite,s3,encryption

      - name: Replication on every SQL catalog
        run: cargo test -p pink-lake --features catalog-postgres,catalog-sqlite --test replication_catalogs

      - name: CLI Postgres catalog
        run: cargo test -p pinkdb-cli --features pinklake,s3,catalog-sqlite,catalog-postgres

      - name: the console over a Postgres catalog (wave 121b)
        run: cargo test -p pinkdb-server --features ui,catalog-postgres,catalog-sqlite --test console_storage

      # The default build must stay lean even after the feature tests above.
      - name: default build links no SQL or Postgres client
        run: '! cargo tree -p pinkdb-cli -e normal | grep -qE "postgres|rusqlite"'

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy, feature sets (-D warnings)
        run: |
          cargo clippy --all-targets -p pinkdb --features encryption -- -D warnings
          cargo clippy --all-targets -p pink-lake --features s3 -- -D warnings
          cargo clippy --all-targets -p pink-lake --features s3,encryption -- -D warnings
          cargo clippy --all-targets -p pink-lake --features catalog-sqlite,s3,encryption -- -D warnings
          cargo clippy --all-targets -p pink-lake --features catalog-s3,encryption -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake,s3,catalog-s3 -- -D warnings
          cargo clippy --all-targets -p pink-lake --features catalog-postgres -- -D warnings
          cargo clippy --all-targets -p pink-lake --features catalog-sqlite,catalog-postgres,s3,encryption -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake,s3,catalog-sqlite -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake,s3,catalog-sqlite,catalog-postgres -- -D warnings
          cargo clippy --all-targets -p pinkdb-server --features tls -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake,s3,repo,client,tls,encryption -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features client,tls -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features pinklake,s3,parquetlake -- -D warnings
          cargo clippy --all-targets -p pinkdb-iceberg --features remote -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features iceberg,httpfs -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features s3 -- -D warnings
          cargo clippy --all-targets -p pinkdb-server --features async-server -- -D warnings
          cargo clippy --all-targets -p pinkdb-js --features engine -- -D warnings
          cargo clippy --all-targets -p pinkdb --features js -- -D warnings
          cargo clippy --all-targets -p pinkdb-cli --features js -- -D warnings

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: wasm check (the core must stay wasm32-compatible)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p pinkdb --target wasm32-unknown-unknown

      - name: playground module (wave 85) — fresh build + Node smoke test
        run: |
          bash website/tools/build-wasm.sh
          node website/tools/wasm-smoke.mjs

      # The console's browser app (wave 121) is outside the workspace and
      # embedded prebuilt (crates/pinkdb-server-ui/web-dist); the workspace
      # tests check that build is fresh. Here: it still compiles, lints clean
      # and its unit tests (and the shared API crate's) pass.
      - name: console app (Leptos, wasm32) — clippy + tests
        working-directory: crates/pinkdb-server-ui-web
        run: |
          cargo clippy --target wasm32-unknown-unknown -- -D warnings
          cargo test

  # The release CLI the duckdiff job consumes. It runs in parallel with the
  # test/clippy jobs instead of at the end of a serial mega-job.
  release-cli:
    name: release CLI (duckdiff artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci

      - name: cargo build --release -p pinkdb-cli (duckdiff artifact)
        # The differential battery includes the opt-in file-format extension
        # probes (both file-format extensions: Arrow IPC and Parquet).
        run: cargo build --release -p pinkdb-cli --features arrow,parquet,httpfs

      - name: upload the release CLI for the duckdiff job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pinkdb-cli-release
          path: target/release/pinkdb
          if-no-files-found: error

  # Differential test against DuckDB. Reuses the release CLI built by
  # `release-cli` (downloaded from the artifact) instead of rebuilding it
  # here; `--big <csv>` enables the 1M-row battery locally.
  duckdiff:
    name: differential vs DuckDB
    runs-on: ubuntu-latest
    needs: release-cli
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: download the release CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pinkdb-cli-release
          path: target/release

      # Artifacts do not reliably carry the executable bit.
      - name: make the CLI executable
        run: chmod +x target/release/pinkdb

      # The probes are pinned against the DuckDB v2.0.0 release (the project's
      # parity target), installed **without piping a remote installer into a
      # shell**: the release asset URL is pinned and its SHA-256 (GitHub's
      # asset digest) is verified before use.
      - name: install the DuckDB CLI (pinned v2.0.0 — the parity reference)
        run: |
          set -euo pipefail
          url='https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz'
          sha256='c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc'
          curl -fL --retry 3 -o /tmp/duckdb-cli.tar.gz "$url"
          echo "$sha256  /tmp/duckdb-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/duckdb-cli.tar.gz -C /tmp duckdb
          sudo install -m 0755 /tmp/duckdb /usr/local/bin/duckdb
          duckdb --version | tee /tmp/duckdb-version
          grep -q '^v2\.0\.0 ' /tmp/duckdb-version

      - name: python3 bench/duckdiff.py
        run: python3 bench/duckdiff.py

  # C ABI down to every language binding: Python (ctypes), Node (napi-rs) and
  # Go (cgo). Each one runs the shared corpus in bindings/conformance.
  bindings:
    name: python + node + go bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bindings

      - name: cargo build --release -p pinkdb-ffi
        run: cargo build --release -p pinkdb-ffi

      - name: C ABI example (make -C crates/pinkdb-ffi hello)
        run: make -C crates/pinkdb-ffi hello

      - name: python3 -m unittest discover -s bindings/python/tests
        run: python3 -m unittest discover -s bindings/python/tests -v

      - name: install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The addon statically links pinkdb-ffi, so cargo rebuilds it here; the
      # corpus is the same file the Python and Go jobs run.
      - name: node --test (build the addon, run the corpus, check npm pack)
        working-directory: bindings/node
        run: |
          npm run build
          node --test "test/*.test.js"
          npm pack --dry-run

      - name: install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: bindings/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      - name: go vet + go test -race ./...
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

  # The Python wheel must work without the checkout: this builds it, installs
  # it into a fresh venv, and runs the corpus with the installed package from
  # a directory that cannot shadow it.
  python-wheel:
    name: python wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: bindings

      - name: build the wheel
        working-directory: bindings/python
        run: |
          python3 -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip setuptools wheel
          /tmp/wheel-venv/bin/pip wheel . --no-deps --no-build-isolation -w dist

      - name: install the wheel and check it is self-contained
        run: |
          /tmp/wheel-venv/bin/pip install --force-reinstall bindings/python/dist/*.whl
          cd /tmp
          /tmp/wheel-venv/bin/python - <<'PY'
          import pathlib
          import pinkdb

          library = pathlib.Path(pinkdb.library_path).resolve()
          assert "site-packages" in library.parts, library
          assert pinkdb.abi_version() == 1, pinkdb.abi_version()
          print("installed wheel loads", library)
          PY
          PINKDB_CONFORMANCE="$GITHUB_WORKSPACE/bindings/conformance/corpus.json" \
            /tmp/wheel-venv/bin/python -m unittest discover \
            -s "$GITHUB_WORKSPACE/bindings/python/tests" -p 'test_conformance.py' -v

  # The three extension SDKs, end to end: each smoke script builds the release
  # CLI and runs a deterministic LOAD EXTENSION session against the compared
  # examples (C/C++, Go and Rust).
  sdk-smokes:
    name: extension SDK smokes (C/C++, Go and Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: sdk-smokes

      - name: install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ext-sdk/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      # Pre-build once so the smoke scripts hit a warm target/ (they build
      # the release CLI themselves, so this is a no-op for them).
      - name: cargo build --release -p pinkdb-cli
        run: cargo build --release -p pinkdb-cli

      - name: make -C ext-sdk/c
        run: make -C ext-sdk/c

      - name: make -C ext-sdk/cpp
        run: make -C ext-sdk/cpp

      - name: ./ext-sdk/c/smoke.sh
        run: ./ext-sdk/c/smoke.sh

      - name: ./ext-sdk/cpp/smoke.sh
        run: ./ext-sdk/cpp/smoke.sh

      - name: ./ext-sdk/go/smoke.sh
        run: ./ext-sdk/go/smoke.sh

      # The link-level invariant behind the wave-77 Linux failure: only a
      # cdylib may carry the `#[no_mangle]` ABI v1 symbols. This checks the
      # linked-only extension rlibs contain none (and the example cdylib still
      # exports all three), so a regression fails here instead of relying on
      # rust-lld's duplicate-symbol error.
      - name: linked-only extensions carry no native ABI exports
        run: ./ext-sdk/rust/check-native-exports.sh

      # The Rust SDK smoke builds its example with cargo (a workspace member)
      # and drives the same CLI session, including the volatile-function
      # refusal. `cargo test -p pinkdb-ext-sdk` (the core test job) also
      # covers the SDK's own native and linked round trips, and
      # `cargo test -p pinkdb-math` links both core extensions plus a locally
      # declared one into one binary (tests/coexist.rs).
      - name: ./ext-sdk/rust/smoke.sh
        run: ./ext-sdk/rust/smoke.sh

      # The four SDKs are also one ABI contract: the same conformance fixture
      # built by each SDK and driven through the loader, so the boundary
      # behaviour (NULL/oversized values, invalid tags, unwind containment,
      # foreign threads, error-path frees, struct_size negotiation) cannot
      # drift apart SDK by SDK. STRICT makes a missing toolchain a failure.
      - name: ABI conformance across the four SDKs
        run: cargo test -p pinkdb-ext-loader --test conformance --test conformance_ownership
        env:
          PINKDB_CONFORMANCE_STRICT: "1"

      # What the host *refuses*: opt-in loading, root confinement, path shape
      # and SHA-256 pinning, all against the release CLI the smokes built.
      - name: ./ext-sdk/posture.sh
        run: ./ext-sdk/posture.sh

  # Real S3 semantics in a container (adobe/s3mock pulled from Docker Hub):
  # round-trip, concurrency races and refusals through the release CLI.
  # continue-on-error is intentionally unset (false): this is a hard gate.
  s3-docker:
    name: S3 round-trip/race (s3mock in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lake-s3

      - name: cargo build --release -p pinkdb-cli --features pinklake,s3,encryption
        run: cargo build --release -p pinkdb-cli --features pinklake,s3,encryption

      - name: crates/pink-lake/tests/s3_docker.sh
        run: SKIP_BUILD=1 crates/pink-lake/tests/s3_docker.sh

  # macOS (arm64) is the development platform and the only published
  # extension platform today: run the core suites there too.
  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos

      - name: cargo build the extensions
        run: cargo build -p pinkdb-mcp -p pinkdb-agent -p pinkdb-memory -p pinkdb-llm

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo test -p pinkdb-cli --features pinklake,s3
        run: cargo test -p pinkdb-cli --features pinklake,s3

      - name: cargo test -p pinkdb --features encryption
        run: cargo test -p pinkdb --features encryption

      - name: python binding on macOS
        run: |
          cargo build --release -p pinkdb-ffi
          python3 -m unittest discover -s bindings/python/tests -v

  # Declared minimum Rust version: 1.97 for the whole workspace (edition
  # 2024). The default-feature graph proves the workspace floor here.
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust 1.97
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.97"

      - name: cargo check (default features, whole workspace)
        run: cargo check --workspace --all-targets

  # Known-vulnerability scan of Cargo.lock (RustSec advisory database).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: cargo install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  # The docs site must keep building on every change (deploy-docs only runs
  # on main).
  docs:
    name: docs site builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: generate docs (build must be committed)
        # The same script the local pre-commit hook runs
        # (scripts/git-hooks/pre-commit), so the two checks cannot drift.
        run: |
          scripts/check-website.sh \
            || { echo "::error::website output is stale — run python3 website/build.py (it also regenerates the changelog page) and commit the result"; exit 1; }

  # Benchmark guard: TPC-H SF 0.01 plus a few micro-benchmarks, compared with
  # `bench/suite/baseline-ci.json`. Deliberately non-blocking — a shared
  # GitHub runner is noisy, so a 2x slowdown is a signal to investigate, not a
  # merge gate. The family is DuckDB-free: it generates its own 60k-row data,
  # so no extension install or download is involved.
  bench-regression:
    name: benchmark regression
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: bench

      # The baseline records the size of this exact feature set, so the guard
      # must measure the same binary.
      - name: build the measured CLI
        run: |
          cargo build --release -p pinkdb-cli \
            --features pinklake,s3,catalog-sqlite,catalog-s3,parquetlake,parquet,fts,vss

      - name: run the guard
        run: python3 bench/suite/run.py --only ci --skip-build
