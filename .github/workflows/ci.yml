# pinkdb CI — build, tests, clippy, feature matrix, bindings, SDK smokes, S3.
#
# Runs on pushes to main and on every pull request. GitHub-hosted runners
# only. Nothing here publishes: that is `publish-extensions.yml`
# (workflow_dispatch), and docs deploy is `deploy-docs.yml` (push to main
# touching website/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# One run per ref; a new push supersedes an in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Core workspace: build, the full test suite, clippy, the feature matrix
  # that matters (S3 / lake / encryption), the wasm check, and the release
  # CLI artifact the duckdiff job consumes.
  build-test:
    name: build, test, clippy, features, wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: default

      - name: cargo build
        run: cargo build

      - name: cargo test
        run: cargo test -q

      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Feature matrix: the combinations that change runtime behavior.
      - name: cargo test -p pink-lake --features s3
        run: cargo test -p pink-lake --features s3

      - name: cargo test -p pinkdb-cli --features lake,s3
        run: cargo test -p pinkdb-cli --features lake,s3

      - name: cargo test -p pinkdb-cli --features encryption
        run: cargo test -p pinkdb-cli --features encryption

      - name: wasm check (the core must stay wasm32-compatible)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p pinkdb --target wasm32-unknown-unknown

      - name: cargo build --release -p pinkdb-cli (duckdiff artifact)
        run: cargo build --release -p pinkdb-cli

      - name: upload the release CLI for the duckdiff job
        uses: actions/upload-artifact@v4
        with:
          name: pinkdb-cli-release
          path: target/release/pinkdb
          if-no-files-found: error

  # Differential test against DuckDB. Reuses the release CLI built by
  # `build-test` (downloaded from the artifact) instead of rebuilding it
  # here; `--big <csv>` enables the 1M-row battery locally.
  duckdiff:
    name: differential vs DuckDB
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: download the release CLI
        uses: actions/download-artifact@v4
        with:
          name: pinkdb-cli-release
          path: target/release

      # Artifacts do not reliably carry the executable bit.
      - name: make the CLI executable
        run: chmod +x target/release/pinkdb

      - name: install the DuckDB CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip
          unzip -q -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install -m 0755 /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: python3 bench/duckdiff.py
        run: python3 bench/duckdiff.py

  # C ABI down to both language bindings: Python (ctypes) and Go (cgo).
  bindings:
    name: python + go bindings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings

      - name: cargo build --release -p pinkdb-ffi
        run: cargo build --release -p pinkdb-ffi

      - name: python3 -m unittest discover -s bindings/python/tests
        run: python3 -m unittest discover -s bindings/python/tests -v

      - name: install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      - name: go test ./...
        working-directory: bindings/go
        run: go test ./...

  # The two extension SDKs, end to end: each smoke script builds the release
  # CLI and runs a deterministic LOAD EXTENSION session against the compared
  # examples (C/C++ and Go).
  sdk-smokes:
    name: extension SDK smokes (C/C++ and Go)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk-smokes

      - name: install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ext-sdk/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      # Pre-build once so both smoke scripts hit a warm target/ (they build
      # the release CLI themselves, so this is a no-op for them).
      - name: cargo build --release -p pinkdb-cli
        run: cargo build --release -p pinkdb-cli

      - name: make -C ext-sdk/c
        run: make -C ext-sdk/c

      - name: ./ext-sdk/c/smoke.sh
        run: ./ext-sdk/c/smoke.sh

      - name: ./ext-sdk/go/smoke.sh
        run: ./ext-sdk/go/smoke.sh

  # Real S3 semantics in a container (adobe/s3mock pulled from Docker Hub):
  # round-trip, concurrency races and refusals through the release CLI.
  # continue-on-error is intentionally unset (false): this is a hard gate.
  s3-docker:
    name: S3 round-trip/race (s3mock in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: lake-s3

      - name: cargo build --release -p pinkdb-cli --features lake,s3
        run: cargo build --release -p pinkdb-cli --features lake,s3

      - name: crates/pink-lake/tests/s3_docker.sh
        run: SKIP_BUILD=1 crates/pink-lake/tests/s3_docker.sh
