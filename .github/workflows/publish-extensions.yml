# Publish extension artifacts to the live extension repository
# (https://pinkdb-ext-repo.defaultcms.workers.dev, R2 bucket
# `pinkdb-extensions`) through `ext-repo/publish.sh` + wrangler.
#
# Triggers:
#   * push of a release tag `v*` — build every catalog platform in a matrix
#     and publish the tag's version (the release train);
#   * workflow_dispatch — the original manual path, optionally one extension,
#     one version and one platform.
#
# Publishing is immutable: an existing name+version+platform is skipped (and
# `publish.py` refuses it outright). Never re-publish a coordinate to change
# bytes — bump the version instead.
#
# Concurrency is deliberately global (`publish-extensions`, never cancelled):
# concurrent catalog writes would race and could drop entries. The matrix jobs
# only build; one publish job fans in and performs every catalog write once.
#
# Required organization secrets (the CLOUDFLARE_* names also work):
#   CF_API_TOKEN   Cloudflare API token with Workers Scripts: Edit + R2: Edit
#                  (R2 is what the publisher uploads to, Workers Scripts what
#                  the single Worker deploy needs)
#   CF_ACCOUNT_ID  the account that owns the R2 bucket
#   PINKDB_EXT_SIGNING_KEY
#                  Ed25519 private key for the catalog signature (PEM content,
#                  base64 of the PEM, or a path). Passed ONLY to the publish
#                  step; see docs/extension-signing.md. Publishing without it
#                  is refused by this workflow (the publisher would otherwise
#                  upload an unsigned catalog that pinned clients reject).
#
# Inputs (all optional, manual dispatch only):
#   name      publish only this extension (default: every discovered one)
#   version   artifact version (default: the version in crates/pinkdb/Cargo.toml)
#   platform  one catalog platform tag; default darwin-arm64 (the historical
#             manual runner). The workflow selects the matching runner, so a
#             forced tag no longer has to match a fixed runner by hand.
name: Publish extensions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      name:
        description: "extension name to publish (default: all discovered)"
        required: false
        type: string
      version:
        description: "artifact version (default: version from crates/pinkdb/Cargo.toml)"
        required: false
        type: string
      platform:
        description: "catalog platform tag, or `all` for every platform (default: darwin-arm64)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-extensions
  cancel-in-progress: false # a catalog publish must never be cancelled mid-flight

env:
  CARGO_TERM_COLOR: always
  # Consumed by ext-repo/publish.py (BASE_URL) and by the steps below.
  PINKDB_EXT_REPO_URL: https://pinkdb-ext-repo.defaultcms.workers.dev

jobs:
  prepare:
    name: resolve version + platform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.coords.outputs.version }}
      name: ${{ steps.coords.outputs.name }}
      matrix: ${{ steps.coords.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: resolve extension version and platforms
        id: coords
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' crates/pinkdb/Cargo.toml | cut -d'"' -f2)
          if [ "$EVENT_NAME" = "push" ]; then
            case "$REF_NAME" in
              v[0-9]*) ;;
              *) echo "::error::extension tags must look like v<version>, got '$REF_NAME'"; exit 1 ;;
            esac
            version="${REF_NAME#v}"
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::tag version $version does not match crates/pinkdb/Cargo.toml ($cargo_version)"
              exit 1
            fi
            platform=""
          else
            version="${INPUT_VERSION:-$cargo_version}"
            platform="${INPUT_PLATFORM:-darwin-arm64}"
            # `all` builds every platform in one run, like a tag push.
            if [ "$platform" = "all" ]; then
              platform=""
            fi
          fi
          name="${INPUT_NAME:-}"
          case "$platform" in
            "") ;;
            darwin-arm64 | darwin-x64 | linux-x64 | linux-arm64) ;;
            windows-x64)
              echo "::error::windows-x64 is representable in the catalog but no Windows build exists yet; see docs/releasing.md"
              exit 1
              ;;
            *)
              echo "::error::unknown platform '$platform' (known: darwin-arm64, darwin-x64, linux-x64, linux-arm64)"
              exit 1
              ;;
          esac
          if [ -n "$platform" ]; then
            matrix=$(python3 scripts/release/matrix.py --kind extensions --platform "$platform")
          else
            matrix=$(python3 scripts/release/matrix.py --kind extensions)
          fi
          {
            echo "version=$version"
            echo "name=$name"
            echo "matrix=$matrix"
          } >>"$GITHUB_OUTPUT"
          echo "publishing extensions $version for ${platform:-every platform}"

  build:
    name: extensions (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install Rust (stable)
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: publish-extensions-${{ matrix.platform }}

      - name: install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ext-sdk/go/go.mod
          cache: false # stdlib-only module: there is no go.sum to cache

      - name: add cross target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"

      - name: build, check architecture, smoke, stage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          set -euo pipefail
          args=(--platform "$PLATFORM" --version "$VERSION" --out "ext-dist/$PLATFORM")
          if [ -n "$NAME" ]; then
            args+=(--name "$NAME")
          fi
          ./scripts/release/build-extensions.sh "${args[@]}"

      - name: upload staged extensions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ext-${{ matrix.platform }}
          path: ext-dist/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish catalog once
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: install wrangler
        run: npm install -g wrangler@4.151.0

      - name: download staged extensions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ext-*
          path: ext-artifacts

      # publish.py decides immutability from ext-repo/index.json, which is
      # gitignored (the canonical catalog lives in R2) — seed it with the
      # live catalog first so an existing coordinate is skipped via the
      # index, not accidentally re-uploaded.
      - name: fetch the live catalog
        run: |
          set -euo pipefail
          mkdir -p ext-repo
          # Only a definite 404 means "no catalog yet". Any other failure
          # (5xx, timeout, DNS) must stop the job: publishing an index built
          # from an empty list would wipe every live entry.
          status=$(curl -sSL --retry 3 --retry-all-errors -o ext-repo/index.json \
            -w '%{http_code}' "$PINKDB_EXT_REPO_URL/index.json" || echo "000")
          case "$status" in
            200)
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert isinstance(d.get("extensions"), list)' ext-repo/index.json \
                || { echo "::error::fetched index.json is not a valid catalog"; exit 1; }
              echo "fetched $PINKDB_EXT_REPO_URL/index.json" ;;
            404)
              echo "::warning::no catalog at $PINKDB_EXT_REPO_URL/index.json — starting from an empty one"
              printf '{"format_version":1,"updated":null,"extensions":[]}\n' > ext-repo/index.json ;;
            *)
              echo "::error::fetching $PINKDB_EXT_REPO_URL/index.json failed (HTTP $status); refusing to publish over the live catalog"
              exit 1 ;;
          esac

      - name: verify staged bytes and skip already-published coordinates
        id: filter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          with open("ext-repo/index.json", encoding="utf-8") as f:
              index = json.load(f)
          published = {
              (e.get("name"), e.get("version"), e.get("platform"))
              for e in index.get("extensions", [])
          }

          manifests = sorted(glob.glob("ext-artifacts/ext-*/manifest.tsv"))
          if not manifests:
              raise SystemExit("error: no staged extension manifests were downloaded")

          rows = []
          for manifest in manifests:
              directory = os.path.dirname(manifest)
              prefix = os.path.basename(directory)
              platform = prefix[len("ext-"):] if prefix.startswith("ext-") else ""
              if not platform:
                  raise SystemExit(f"error: unexpected artifact directory {directory!r}")
              for line in open(manifest, encoding="utf-8"):
                  line = line.rstrip("\n")
                  if not line:
                      continue
                  name, version, row_platform, filename, description, digest = line.split("\t")
                  if row_platform != platform:
                      raise SystemExit(
                          f"error: {manifest}: row platform {row_platform!r} != directory {platform!r}"
                      )
                  artifact = os.path.join(directory, filename)
                  if not os.path.isfile(artifact):
                      raise SystemExit(f"error: {name}: staged artifact is missing: {artifact}")
                  actual = hashlib.sha256(open(artifact, "rb").read()).hexdigest()
                  if actual != digest:
                      raise SystemExit(
                          f"error: {name} ({platform}): staged sha256 {actual} != manifest {digest}"
                      )
                  coordinate = (name, version, platform)
                  if coordinate in published:
                      print(f"  skip    {name} {version} ({platform}) — already in the live catalog")
                      continue
                  print(f"  publish {name} {version} ({platform}) {artifact}")
                  rows.append((name, version, platform, artifact, description))

          with open("/tmp/pinkdb-publish.tsv", "w", encoding="utf-8") as f:
              for row in rows:
                  f.write("\t".join(row) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"count={len(rows)}\n")
          print(f"{len(rows)} artifact(s) to publish")
          PY

      # The publisher refuses existing coordinates on its own too (it exits 1
      # on a name+version+platform already present in the index); the filter
      # above only turns "already published" into a skip so a tag release is
      # idempotent across platforms added later.
      - name: publish to the extension repository (signs the catalog)
        if: steps.filter.outputs.count != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Scoped to this step only: the signing key is never exported to the
          # build, filter, verification, or Worker-deploy steps.
          PINKDB_EXT_SIGNING_KEY: ${{ secrets.PINKDB_EXT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PINKDB_EXT_SIGNING_KEY:-}" ]; then
            echo "::error::PINKDB_EXT_SIGNING_KEY is not set; refusing to publish an unsigned catalog"
            exit 1
          fi
          while IFS=$'\t' read -r name version platform artifact description; do
            [ -n "$name" ] || continue
            echo "==> $name $version ($platform)"
            ./ext-repo/publish.sh "$artifact" \
              --name "$name" \
              --version "$version" \
              --platform "$platform" \
              --description "$description"
          done < /tmp/pinkdb-publish.tsv

      # Post-sign gate: the local mirror's signature must verify against the
      # in-tree public key, the live catalog + signature must verify, and
      # every artifact published by this run must download and hash-match the
      # signed catalog. Non-zero on any failure.
      - name: verify the published catalog signature and artifacts
        if: steps.filter.outputs.count != '0'
        run: |
          set -euo pipefail
          ./ext-repo/verify.sh --skip-artifacts

          # Cache-bust the live catalog (the Worker serves it with max-age=60);
          # the signature is over the bytes, not the URL, and the Worker routes
          # on the path, so a query string is safe here.
          ts=$(date +%s)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "$PINKDB_EXT_REPO_URL/index.json?ts=$ts" -o "$tmp/index.json"
          curl -fsSL "$PINKDB_EXT_REPO_URL/index.json.sig?ts=$ts" -o "$tmp/index.json.sig"
          ./ext-repo/verify.sh \
            --index "$tmp/index.json" \
            --sig "$tmp/index.json.sig" \
            --skip-artifacts

          while IFS=$'\t' read -r name version platform artifact _; do
            [ -n "$name" ] || continue
            ./ext-repo/verify.sh \
              "$PINKDB_EXT_REPO_URL/artifacts/$name/$version/$platform/$(basename "$artifact")" \
              "$PINKDB_EXT_REPO_URL/index.json?ts=$ts"
          done < /tmp/pinkdb-publish.tsv

      # Exactly one deploy, after every catalog write and verification, so the
      # Worker never serves a half-updated catalog. It needs Cloudflare
      # credentials but never the signing key.
      - name: deploy the extension Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ext-repo/worker
        run: wrangler deploy

      - name: report artifact URLs
        if: steps.filter.outputs.count != '0'
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r name version platform artifact _; do
            [ -n "$name" ] || continue
            echo "$PINKDB_EXT_REPO_URL/artifacts/$name/$version/$platform/$(basename "$artifact")"
          done < /tmp/pinkdb-publish.tsv
          echo "catalog: $PINKDB_EXT_REPO_URL/index.json"
          curl -fsSL "$PINKDB_EXT_REPO_URL/index.json?ts=$(date +%s)" -o /tmp/pinkdb-catalog.json
          python3 - <<'PY'
          import json
          with open("/tmp/pinkdb-catalog.json", encoding="utf-8") as f:
              catalog = json.load(f)
          extensions = catalog.get("extensions", [])
          print(f"live catalog: {len(extensions)} entries, updated {catalog.get('updated')}")
          PY

      # Catalog signing is implemented in publish.py (Ed25519 over the exact
      # index.json bytes → index.json.sig, uploaded next to the catalog), the
      # post-sign gate above verifies it with the in-tree public key, and the
      # CLI's `.install` pins that key and verifies before any artifact fetch.
      # See docs/extension-signing.md.
