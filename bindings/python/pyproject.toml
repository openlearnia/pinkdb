[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinkdb"
version = "0.1.0"
description = "Python binding (stdlib ctypes) for the pinkdb embedded database C ABI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["database", "sql", "embedded", "olap", "duckdb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[tool.setuptools]
packages = ["pinkdb"]
