[package]
name = "pinkdb-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[[bin]]
name = "pinkdb"
path = "src/main.rs"

[features]
# Default build: the first-party **json** (wave 52), **datetime** (wave 56) and
# **math** (wave 54) extensions are linked and published in the linked registry
# at startup, then loaded into every store the session opens, so `json_*`, the
# datetime functions and `exp`/`log`/`random` work out of the box (the DuckDB
# behavior). `--no-default-features` produces the lean binary without them.
# Like every extension each costs a `LOAD EXTENSION` prefix in the WAL of the
# statements that call it, and a durable store replayed by a build without the
# feature refuses those records instead of dropping them.
default = ["json", "datetime", "math"]
# Core json extension: `pinkdb-json` (JSON as VARCHAR in v1).
json = ["dep:pinkdb-json"]
# Core datetime extension: `pinkdb-datetime` (strftime, strptime, epoch,
# epoch_ms, dayofweek, dayofyear, week, last_day, age, make_date).
datetime = ["dep:pinkdb-datetime"]
# Core math extension: `pinkdb-math` (exp/ln/log, trigonometry, random()).
math = ["dep:pinkdb-math"]
# Opt-in full-text search (wave 108a): BM25 indexes with DuckDB's fts
# surface (`CALL create_fts_index`, `match_bm25`, `stem`, `rrf`). Off by
# default: it is the first extension that needs engine hooks beyond scalars
# (named arguments, a host statement that runs SQL), and a store whose log
# built an index needs the feature to replay. `match_bm25` is plain SQL, so
# the MCP `query` tool can rank under the read-only policy while
# `create_fts_index` (a write) is refused there.
fts = ["dep:pinkdb-fts"]
# `fts` plus a custom `ignore` regex (pinkdb-fts/custom-ignore).
fts-regex = ["fts", "pinkdb-fts/custom-ignore"]
# Opt-in core arrow extension (wave 71): Arrow IPC (Feather v2) file
# read/write over arrow-rs — `FROM 'f.arrow'`, `read_arrow('f.arrow')` and
# `COPY t TO 'f.arrow' (FORMAT arrow)`. Registers the table source and the
# COPY sink process-wide at startup (`pinkdb_arrow::ensure_registered`), so
# every store this build creates or opens — including a durable reopen that
# replays a logged `INSERT … SELECT … FROM 'f.arrow'` (replay re-reads the
# file, DuckDB's rule) — resolves them; a lean build fails such a replay with
# a clear error at bind instead. Never a default feature: it links the
# arrow-rs crates.
arrow = ["dep:pinkdb-arrow"]
# Opt-in parquet reader (wave 70): `read_parquet`/`parquet_scan`, the
# `parquet_schema`/`parquet_metadata`/`parquet_file_metadata`/
# `parquet_kv_metadata` introspection functions, and DuckDB's replacement
# scan (`FROM 'file.parquet'`). Not a default feature: the arrow-rs
# `parquet` crate and its codec dependencies are the largest dependency any
# extension brings, and the default CLI stays lean.
parquet = ["dep:pinkdb-parquet"]
# Opt-in Iceberg v2 reader (wave 72): `iceberg_scan`, `iceberg_snapshots` and
# `iceberg_metadata` over a local, `https://` or `s3://` table location. Turns
# `parquet` on — data files are read by that reader — and the `httpfs`
# feature, when also given, enables the remote half.
iceberg = ["dep:pinkdb-iceberg", "parquet"]
# Opt-in remote-file access (wave 75): `read_csv('https://…/x.csv')`,
# `read_csv('s3://bucket/x.csv')`, the replacement scan for `.csv` paths and
# the two schemes, and `.import <url>` / `import_csv(url)` through the shared
# `pinkdb-httpfs` transport. Registers the CSV table source process-wide at
# startup so a durable reopen replays a logged read (re-read policy). The
# transport also carries the SigV4 S3 client pink-lake's `s3` feature uses.
# When the `parquet`/`arrow` features are also on, this enables their
# `remote` halves too, so `--features parquet,arrow,httpfs` reads remote
# `.parquet`/`.arrow` objects from the same crate (`?/remote` leaves an
# absent format absent — `httpfs` alone stays transport + CSV).
httpfs = ["dep:pinkdb-httpfs", "pinkdb-httpfs/s3", "pinkdb-parquet?/remote", "pinkdb-arrow?/remote", "pinkdb-iceberg?/remote"]
# Opt-in zstd parquet codec: forwards to pinkdb-parquet's `zstd` feature
# (which compiles the C zstd library through `zstd-sys`, so a C toolchain for
# the target is required).
parquet-zstd = ["parquet", "pinkdb-parquet/zstd"]
# Opt-in remote mode: `pinkdb --host HOST:PORT` talks to a pinkdb-server.
client = ["dep:pinkdb-server"]
# Opt-in TLS for remote mode: `--tls`, `--tls-ca-cert PATH` and
# `--tls-insecure` work and the transport is rustls-encrypted. Implies
# `client` and forwards to `pinkdb-server/tls`.
tls = ["client", "pinkdb-server/tls"]
# Opt-in at-rest encryption: forwards to `pinkdb/encryption`; `PINKDB_KEY`
# then encrypts `.save` and decrypts `.open`. When a lake feature is built
# too, the same key encrypts the lake at rest (pink-lake's `encryption`
# feature): every `.lake` artifact becomes a `PNKLAKE1` container.
encryption = ["pinkdb/encryption", "pink-lake?/encryption"]
# Opt-in JavaScript procedures: forwards to `pinkdb/js` (the `pinkdb-js`
# sandbox contract; the engine binding is the recorded follow-up).
js = ["pinkdb/js"]
# Opt-in extension repository: `.install`, `.repositories`, `.installed` and the
# SQL `INSTALL`/`LOAD <name>` statements. The client lives in the engine
# (`pinkdb/repo`: HTTP over rustls, catalog JSON, SHA-256 and Ed25519
# signature verification), so the feature forwards to it and the default
# binary stays byte-for-byte unaffected.
repo = ["pinkdb/repo"]
# Opt-in lake layer: `.lake save/open/versions/tables/info/attach` snapshot
# the store into a lake catalog database (a `.pink`, SQLite or Postgres
# database) plus immutable `.pink` data files. Keeps the default binary lean:
# the lake code lives only behind this feature.
pinklake = ["dep:pink-lake"]
# Opt-in Parquet lake format (wave 87): `pinklake` plus the parquet extension
# and the `pink-lake-parquet` provider. Registers the `parquet` format at
# startup, so `.lake format parquet` makes subsequent `.lake save`/commits
# write `.parquet` data files (read through the existing parquet reader).
parquetlake = ["pinklake", "parquet", "dep:pink-lake-parquet"]
# Opt-in object storage for the lake: `.lake …` accepts `s3://bucket/prefix`
# URLs (AWS S3, Cloudflare R2) via pink-lake's `s3` feature (ureq + SigV4).
# Pure storage: it implies no lake build, and on its own it adds the storage
# client but no `.lake` commands. Combine explicitly:
# `cargo build -p pinkdb-cli --features pinklake,s3` (add `,encryption` for a
# keyed lake).
s3 = ["pink-lake/s3"]
# Opt-in SQL catalog for the lake (wave 96a): `.lake save/open/attach` accept
# `sqlite:<path>` as the catalog location, with the data files at the `data`
# location given at create. Forwards to pink-lake's `catalog-sqlite`; the
# `?` keeps it from enabling the optional pink-lake dependency on its own (a
# `catalog-sqlite`-only build stays a lean CLI), so combine it with a lake
# feature exactly like `s3`.
catalog-sqlite = ["pink-lake?/catalog-sqlite"]
# Opt-in Postgres catalog for the lake (wave 96a): the same `.lake save/open/
# attach/commit` surface with the metadata in Postgres. A catalog URL is
# `postgres://user:password@host:5432/db?schema=lake` (a password is redacted
# from every message); the data location is local or `s3://` and is given with
# `data` at create. Forwards to pink-lake's `catalog-postgres`; like
# `catalog-sqlite` the `?` keeps it from enabling pink-lake on its own.
catalog-postgres = ["pink-lake?/catalog-postgres"]

[dependencies]
pinkdb = { path = "../pinkdb" }
# The optional SHA-256 pin allowlist (`--extension-pin`): a workspace crate the
# engine already links, so this adds no dependency to the binary beyond the API
# the flag needs.
pinkdb-ext-loader = { path = "../pinkdb-ext-loader" }
rustyline = "14"
# Core json extension (default feature): six DuckDB JSON functions over
# VARCHAR (v1 has no JSON type). Links no external crates — parsing and
# rendering are hand rolled — so the default binary grows by a few KB only.
pinkdb-json = { path = "../../extensions/json", optional = true }
# Core datetime extension (default feature): ten DuckDB date/time functions
# over naive DATE/TIMESTAMP. Links only the Rust extension SDK (calendar math
# and the format engine are hand rolled), so it is a few KB, too.
pinkdb-datetime = { path = "../../extensions/datetime", optional = true }
# Core math extension (default feature): exp/ln/log, the trigonometric family
# and the volatile random(), through the Rust extension SDK. Zero external
# crates — `std`'s `f64` math and a hand-rolled PRNG.
pinkdb-math = { path = "../../extensions/math", optional = true }
# Opt-in full-text search (wave 108a): the `pinkdb-fts` package — BM25
# scoring, the Porter stemmer, the tokenizer, and the index tables it writes
# through the engine's host hooks.
pinkdb-fts = { path = "../../extensions/fts", optional = true }
# Core arrow extension (opt-in `arrow` feature): Arrow IPC file read/write —
# the engine-adjacent crate that implements `pinkdb::FileFormat` over the
# arrow-rs crates (`arrow-array`/`arrow-ipc`/`arrow-schema`, pinned to the
# 59.x line the parquet extension uses).
pinkdb-arrow = { path = "../../extensions/arrow", optional = true }
pinkdb-server = { path = "../pinkdb-server", optional = true }
# Parquet reader (parquet feature): the engine-adjacent table source. Links
# the arrow-rs `parquet` crate; opt-in only, so the default binary is
# byte-for-byte unaffected.
pinkdb-parquet = { path = "../../extensions/parquet", optional = true }
# Iceberg v2 reader (iceberg feature): metadata and Avro manifests decoded in
# the extension, data files through `pinkdb-parquet`.
pinkdb-iceberg = { path = "../../extensions/iceberg", optional = true }
# Remote-file transport and the `read_csv` table source (httpfs feature):
# https GET/range + the SigV4 S3 client shared with pink-lake.
pinkdb-httpfs = { path = "../pinkdb-httpfs", optional = true }
# Lake layer (`pinklake` feature): catalog + immutable data files.
pink-lake = { path = "../pink-lake", optional = true }
# Parquet lake format provider (`parquetlake` feature): the LakeFormat bridge
# over pinkdb-parquet's reader and writer.
pink-lake-parquet = { path = "../pink-lake-parquet", optional = true }

[dev-dependencies]
# Test-only self-signed certificate generation for the TLS remote-mode tests.
rcgen = "0.14"
# The MCP bridge is never linked into this binary: tests/mcp.rs runs the CLI
# with `LOAD EXTENSION`, so it needs the extension's shared library (`cargo
# build -p pinkdb-mcp` writes it to the workspace target directory; set
# PINKDB_MCP_LIB to use one from elsewhere). serde_json parses the JSON-RPC
# replies on the client side (already in the workspace; the binary links it
# only behind `repo`).
serde_json = "1"
# tests/repo.rs builds and signs catalogs itself: SHA-256 for the artifact
# hashes, Ed25519 for the catalog envelope and its base64 encoding.
sha2 = "0.10"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
base64 = "0.23"
