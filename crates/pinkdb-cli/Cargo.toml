[package]
name = "pinkdb-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "pinkdb"
path = "src/main.rs"

[features]
# Opt-in remote mode: `pinkdb --host HOST:PORT` talks to a pinkdb-server.
client = ["dep:pinkdb-server"]
# Opt-in at-rest encryption: forwards to `pinkdb/encryption`; `PINKDB_KEY`
# then encrypts `.save` and decrypts `.open`. When a lake feature is built
# too, the same key encrypts the lake at rest (pink-lake's `encryption`
# feature): every `.lake` artifact becomes a `PNKLAKE1` container.
encryption = ["pinkdb/encryption", "pink-lake?/encryption"]
# Opt-in extension-repository client: `.install`, `.repositories`, `.installed`.
# Keeps the default binary lean: HTTP + TLS, JSON parsing, and SHA-256 live
# only behind this feature.
repo = ["dep:ureq", "dep:serde_json", "dep:sha2"]
# Opt-in lake layer (full): `.lake save/open/versions/tables/info/attach`
# snapshot the store into a `pink-lake` directory (JSON metadata + immutable
# Vortex data files). Keeps the default binary lean: lake + JSON metadata +
# Vortex code lives only behind this feature.
vortexlake = ["dep:pink-lake", "pink-lake/vortexlake"]
# Opt-in `pinklake` lake layer: the same `.lake save/open/versions/tables/info`
# commands plus the statistics-only `.lake attach`, over the v1 `.pink`
# data-file format, without the Vortex dependency (~42 MB of binary size).
# Reading a v2/v3 Vortex lake fails with a clear feature error.
pinklake = ["dep:pink-lake"]
# Opt-in object storage for the lake: `.lake …` accepts `s3://bucket/prefix`
# URLs (AWS S3, Cloudflare R2) via pink-lake's `s3` feature (ureq + SigV4).
# Pure storage: it implies neither lake build, and on its own it adds the
# storage client but no `.lake` commands. Combine explicitly:
# `cargo build -p pinkdb-cli --features pinklake,s3` or
# `--features vortexlake,s3` (add `,encryption` for a keyed lake).
s3 = ["pink-lake/s3"]

[dependencies]
pinkdb = { path = "../pinkdb" }
rustyline = "14"
pinkdb-server = { path = "../pinkdb-server", optional = true }
# Repository client (repo feature): blocking HTTP over rustls (no gzip: the
# repository serves raw artifacts), catalog JSON, and SHA-256 verification.
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# Lake layer (vortexlake/pinklake features): catalog + immutable data files.
pink-lake = { path = "../pink-lake", optional = true }
