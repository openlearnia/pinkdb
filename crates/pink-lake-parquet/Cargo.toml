[package]
name = "pink-lake-parquet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pink-lake's Parquet data-file format provider: the wave-87 LakeFormat bridge over pinkdb-parquet's reader and writer"
license = "MIT"

[features]
# Wave 103: the DuckLake/SQLite catalog interop tests. Forwarded so
# `cargo test -p pink-lake-parquet --features catalog-sqlite` runs them.
catalog-sqlite = ["pink-lake/catalog-sqlite"]
# Wave 103 T2: the Postgres-catalog interop case (needs a live test server from
# PINKDB_TEST_POSTGRES_URL).
catalog-postgres = ["catalog-sqlite", "pink-lake/catalog-postgres", "pink-lake/catalog-sqlite"]

[dependencies]
pink-lake = { path = "../pink-lake" }
pinkdb = { path = "../pinkdb" }
# The existing parquet reader (`read_parquet`, the source) and the new
# low-level writer (`write_table`). Default features keep the codecs the
# reader already supports.
pinkdb-parquet = { path = "../../extensions/parquet" }

[dev-dependencies]
serde_json = "1"
# The wave-88 mixed-lake test needs the built-in Vortex provider and the
# Parquet provider in one process; enabling `vortexlake` here affects test
# targets only (the normal dependency above stays feature-lean). Wave 98b's
# fast-read tests also need the mock-S3 backend.
pink-lake = { path = "../pink-lake", features = ["vortexlake", "s3", "encryption"] }
