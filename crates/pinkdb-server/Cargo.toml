[package]
name = "pinkdb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb network server: TCP server + blocking client for the pinkdb engine"
license = "MIT"

[lib]
name = "pinkdb_server"
path = "src/lib.rs"

[[bin]]
name = "pinkdb-server"
path = "src/bin/pinkdb-server.rs"

[dependencies]
pinkdb = { path = "../pinkdb" }
