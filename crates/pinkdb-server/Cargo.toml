[package]
name = "pinkdb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb network server: TCP server + blocking client for the pinkdb engine"
license = "MIT"

[features]
# The core scalar extensions the CLI links too (json, datetime, math, string):
# published before the store opens and loaded into it, so a client gets
# DuckDB's `json_*`, date, math and string functions without a `LOAD
# EXTENSION`. `--no-default-features` builds the lean server without them.
default = ["json", "datetime", "math", "string"]
json = ["dep:pinkdb-json"]
datetime = ["dep:pinkdb-datetime"]
math = ["dep:pinkdb-math"]
string = ["dep:pinkdb-ext-string"]
# Opt-in async transport (wave 47): a tokio-based listener that speaks the
# same framed protocol (v8) and drives the same blocking engine calls through
# `spawn_blocking`, so existing clients work unchanged. This is the documented
# carve-out to the workspace's zero-async rule, scoped to the I/O boundary
# only: the executor/engine stay synchronous, and the default build pulls no
# async runtime (see the crate docs' "Async carve-out" section).
async-server = ["dep:tokio"]
# Opt-in TLS transport: rustls (audited, pure Rust) with PEM certificate and
# key configuration. Off by default: the default build has no TLS code and no
# TLS dependencies.
tls = ["dep:rustls", "dep:rustls-pemfile"]
# Lake databases (wave 124) are part of every build: `CREATE DATABASE …
# (TYPE LAKE)` and `ATTACH` open `pink:` catalogs over local data. These
# features add the other catalog backends and S3 data, forwarding to
# `pink-lake`.
catalog-sqlite = ["pink-lake/catalog-sqlite"]
catalog-postgres = ["pink-lake/catalog-postgres"]
lake-s3 = ["pink-lake/s3"]
catalog-s3 = ["lake-s3", "pink-lake/catalog-s3"]
# Opt-in warehouse browsing UI (wave 78): the read-only web console the
# server serves next to its binary protocol. Off by default: the default
# build does not even compile the console crate, so the lean server binary is
# unchanged (see `docs/server-ui.md`).
ui = ["dep:pinkdb-server-ui"]
# Wave 121b: the file readers an import uses, registered process-wide before
# the store opens (the CLI's order). `parquet` reads local Parquet files;
# `httpfs` adds the CSV table source (local, https://, s3://) and remote
# Parquet. Off by default: the default server reads no files.
parquet = ["dep:pinkdb-parquet"]
# Wave 132b: the lake's Parquet data-file format, the CLI's `parquetlake`
# feature under the same name. A DuckLake catalog is Parquet whatever made it
# (stock DuckDB writes Parquet), so a server that must write into one needs the
# provider registered. Off by default, like the CLI's.
parquetlake = ["parquet", "dep:pink-lake-parquet"]
httpfs = ["dep:pinkdb-httpfs", "pinkdb-httpfs/s3", "pinkdb-parquet?/remote"]
# Opt-in full-text search (wave 108a): publishes the `pinkdb-fts` package and
# loads it into the store the server opens, so `match_bm25` works without a
# client `LOAD EXTENSION` (which still needs --allow-load-extension). Off by
# default: the default server binary does not change.
fts = ["dep:pinkdb-fts"]
# `fts` plus a custom `ignore` regex (pinkdb-fts/custom-ignore).
fts-regex = ["fts", "pinkdb-fts/custom-ignore"]
# Opt-in embeddings (wave 107c): publishes the `pinkdb-embeddings` package and
# loads it into the store the server opens, so `embed(text)` works without a
# client `LOAD EXTENSION`. Off by default: the default server binary is
# unchanged.
embeddings = ["dep:pinkdb-embeddings"]
# Opt-in vector similarity search (wave 107b), the same package the CLI's
# `vss` feature publishes.
vss = ["dep:pinkdb-vss"]
[lib]
name = "pinkdb_server"
path = "src/lib.rs"

[[bin]]
name = "pinkdb-server"
path = "src/bin/pinkdb-server.rs"

[dependencies]
pinkdb = { path = "../pinkdb" }
# Opt-in full-text search (wave 108a): the BM25 package.
pinkdb-json = { path = "../../extensions/json", optional = true }
pinkdb-datetime = { path = "../../extensions/datetime", optional = true }
pinkdb-math = { path = "../../extensions/math", optional = true }
pinkdb-ext-string = { path = "../../extensions/string", optional = true }
pinkdb-fts = { path = "../../extensions/fts", optional = true }
# Opt-in embeddings (wave 107c): the `embed(text)` package.
pinkdb-embeddings = { path = "../../extensions/embeddings", optional = true }
pinkdb-vss = { path = "../../extensions/vss", optional = true }
# Import readers (wave 121b; `parquet` / `httpfs` features only).
pinkdb-parquet = { path = "../../extensions/parquet", optional = true }
pinkdb-httpfs = { path = "../pinkdb-httpfs", optional = true }
# Lake databases (wave 124): pink-lake's opener, registered before the store
# opens so its replay can open the lakes it names.
pink-lake = { path = "../pink-lake" }
# The lake's Parquet data-file format (`parquetlake` feature only): a DuckLake
# catalog holds Parquet files, and pinkdb writes the same format into one.
pink-lake-parquet = { path = "../pink-lake-parquet", optional = true }
# The optional SHA-256 pin allowlist (`--extension-pin`): a workspace crate the
# engine already links, so this adds no dependency to the binary beyond the API
# the flag needs.
pinkdb-ext-loader = { path = "../pinkdb-ext-loader" }
# Async transport (`async-server` feature only): the listener, per-connection
# frame I/O, timers, and the blocking pool that runs engine calls. `net` +
# `rt-multi-thread` + `time` + `sync` + `io-util`; no other runtime feature is
# needed, and the whole dependency is absent from default builds.
tokio = { version = "1.53", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
], optional = true }
# TLS transport (`tls` feature): the same rustls + ring stack the repository
# client and the lake S3 client already use elsewhere in the workspace.
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
# The warehouse browsing UI (`ui` feature only): a read-only web console
# (axum/tokio) with its own runtime on its own thread. Optional, so the
# default build pulls neither the console nor its async runtime.
pinkdb-server-ui = { path = "../pinkdb-server-ui", optional = true }

# Graceful shutdown (wave 124): SIGINT/SIGTERM set a flag the accept loop
# polls (already in the dependency tree through the engine's crates).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The lake database tests need SQLite and a mock S3 data store; the features
# are unified for test builds only.
pink-lake = { path = "../pink-lake", features = ["catalog-sqlite", "s3"] }
# Test-only self-signed certificate generation (the `tls` tests); `ring` is
# already in the workspace's crypto stack.
rcgen = "0.14"
# The wave-105 MCP bridge test speaks JSON-RPC over HTTP as a client.
serde_json = "1"