[package]
name = "pinkdb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb network server: TCP server + blocking client for the pinkdb engine"
license = "MIT"

[features]
default = []
# Opt-in async transport (wave 47): a tokio-based listener that speaks the
# same framed protocol (v8) and drives the same blocking engine calls through
# `spawn_blocking`, so existing clients work unchanged. This is the documented
# carve-out to the workspace's zero-async rule, scoped to the I/O boundary
# only: the executor/engine stay synchronous, and the default build pulls no
# async runtime (see the crate docs' "Async carve-out" section).
async-server = ["dep:tokio"]
# Opt-in TLS transport: rustls (audited, pure Rust) with PEM certificate and
# key configuration. Off by default: the default build has no TLS code and no
# TLS dependencies.
tls = ["dep:rustls", "dep:rustls-pemfile"]
# `--catalog` mode (wave 96b): the store lives in a pink-lake lake. Off by
# default, so the default binary links no lake code at all; `catalog` alone
# serves `pink:` catalogs over a local data directory, and the backend and
# data-store features forward to `pink-lake` (and imply `catalog`).
catalog = ["dep:pink-lake"]
catalog-sqlite = ["catalog", "pink-lake/catalog-sqlite"]
catalog-postgres = ["catalog", "pink-lake/catalog-postgres"]
lake-s3 = ["catalog", "pink-lake/s3"]
# Opt-in warehouse browsing UI (wave 78): the read-only web console the
# server serves next to its binary protocol. Off by default: the default
# build does not even compile the console crate, so the lean server binary is
# unchanged (see `docs/server-ui.md`).
ui = ["dep:pinkdb-server-ui"]
[lib]
name = "pinkdb_server"
path = "src/lib.rs"

[[bin]]
name = "pinkdb-server"
path = "src/bin/pinkdb-server.rs"

[dependencies]
pinkdb = { path = "../pinkdb" }
# `--catalog` mode (wave 96b): the lake catalog and data store, only with the
# `catalog` feature (see above).
pink-lake = { path = "../pink-lake", optional = true }
# The optional SHA-256 pin allowlist (`--extension-pin`): a workspace crate the
# engine already links, so this adds no dependency to the binary beyond the API
# the flag needs.
pinkdb-ext-loader = { path = "../pinkdb-ext-loader" }
# Async transport (`async-server` feature only): the listener, per-connection
# frame I/O, timers, and the blocking pool that runs engine calls. `net` +
# `rt-multi-thread` + `time` + `sync` + `io-util`; no other runtime feature is
# needed, and the whole dependency is absent from default builds.
tokio = { version = "1.53", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
], optional = true }
# TLS transport (`tls` feature): the same rustls + ring stack the repository
# client and the lake S3 client already use elsewhere in the workspace.
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
# The warehouse browsing UI (`ui` feature only): a read-only web console
# (axum/tokio) with its own runtime on its own thread. Optional, so the
# default build pulls neither the console nor its async runtime.
pinkdb-server-ui = { path = "../pinkdb-server-ui", optional = true }

[dev-dependencies]
# The `--catalog` tests (built with the `catalog` feature) need SQLite and a
# mock S3 data store; the features are unified for test builds only.
pink-lake = { path = "../pink-lake", features = ["catalog-sqlite", "s3"] }
# Test-only self-signed certificate generation (the `tls` tests); `ring` is
# already in the workspace's crypto stack.
rcgen = "0.14"
# The wave-105 MCP bridge test speaks JSON-RPC over HTTP as a client.
serde_json = "1"