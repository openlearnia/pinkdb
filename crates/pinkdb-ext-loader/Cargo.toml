[package]
name = "pinkdb-ext-loader"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb extension loading: dlopen ABI v1 (native) plus the linked registry model (wasm, host registration)"
license = "MIT"

[lib]
name = "pinkdb_ext_loader"

# dlopen/dlsym, scoped to this crate — and to native targets: wasm32 has no
# dynamic linker, so there the crate builds with zero dependencies and the
# linked registry model (`src/linked.rs`) is the whole loading story.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The host calls it; it calls nothing else back into Rust.
libloading = "0.8"

[dev-dependencies]
# The late-registration test opens the same test extension to call its
# post-init probe symbol.
libloading = "0.8"
# Deliberate dev-dependency cycle: `pinkdb` depends on this crate (the
# `PinkDb::load_extension` wrapper and the dynamic-function registry live in
# the engine, next to the binder/executor integration). Cargo permits cycles
# through dev-dependencies, which lets the integration tests here drive the
# full engine end to end (load a compiled C extension, run SQL, assert the
# results) without adding a production dependency back on `pinkdb`.
pinkdb = { path = "../pinkdb" }
