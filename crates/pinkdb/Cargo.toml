[package]
name = "pinkdb"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "pinkdb: mini DuckDB — embedded analytical SQL in Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in at-rest encryption (`.pink` checkpoints + sidecar WAL). Off by
# default: default builds link no crypto code and unencrypted files stay
# byte-identical. `cargo build --features encryption`.
encryption = ["dep:aes-gcm", "dep:argon2"]
# Opt-in JavaScript procedures (`CREATE PROCEDURE … LANGUAGE JAVASCRIPT AS
# $$…$$`): links the pinkdb-js sandbox crate. Off by default — the default
# build stays engine-free and lean. `cargo build --features js`.
js = ["dep:pinkdb-js"]

[dependencies]
csv = "1"
peg = "0.8"
rayon = "1.12.0"
# Audited RustCrypto crates, only linked with the `encryption` feature.
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
# The JavaScript procedure sandbox, only linked with the `js` feature.
pinkdb-js = { path = "../pinkdb-js", optional = true }

# Loadable extensions (ABI v1) are native-only by construction: the loader
# crate links `libloading` (dlopen/dlsym), which does not build for wasm32.
# The dependency edge is target-gated here, and the engine cfg-gates the
# dynamic-function registry/binder/executor paths (a wasm build gets a clear
# "extensions are not supported on wasm targets" error from
# `PinkDb::load_extension`). Native builds are byte-identical.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The loader crate owns the only dlopen dependency; the engine side is the
# dynamic scalar registry + binding + execution of registered callbacks.
pinkdb-ext-loader = { path = "../pinkdb-ext-loader" }

# Single-process durable-path benchmark: `cargo bench -p pinkdb --bench durable`.
[[bench]]
name = "durable"
harness = false
