[package]
name = "pink-lake"
version = "0.1.0"
edition = "2021"
description = "pink-lake: the minimal pinkdb lake layer — a JSON catalog + immutable per-table data files on local disk (Vortex by default, v1 `.pink` still readable)"
license = "MIT"

[dependencies]
pinkdb = { path = "../pinkdb" }
# Metadata only: the catalog/snapshot JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The default data format (v2 lakes): one Vortex file per table, written
# through the `vortex` facade (arrays + the file writer/reader with builtin
# codecs). `default-features = false, features = ["files"]` drops the
# wasm-bindgen/tensor/parquet-variant extras and the zstd codec — the builtin
# Vortex encodings are still registered by `VortexSession::default()`.
vortex = { version = "0.88.0", default-features = false, features = ["files"] }
