[package]
name = "pink-lake"
version = "0.1.0"
edition = "2024"
# The workspace MSRV.
rust-version = "1.97"
description = "pink-lake: the minimal pinkdb lake layer — a DuckLake-compatible catalog database plus immutable per-table `.pink` data files on local disk or S3"
license = "MIT"

[features]
default = []
# Opt-in object storage: `s3://bucket/prefix` lake locations over the S3 REST
# API (AWS S3, Cloudflare R2, MinIO, …). Since wave 75 the SigV4 client lives
# in the shared `pinkdb-httpfs` crate (also the engine's remote-file
# transport); this feature forwards to its `s3` half.
s3 = ["dep:pinkdb-httpfs", "pinkdb-httpfs/s3"]
# Opt-in at-rest encryption (`PNKLAKE1` containers over data and delete
# files). Audited RustCrypto crates only (the same AES-256-GCM the engine's
# `pinkdb/encryption` uses; per-file keys are raw, so no KDF is linked here).
# Without the feature a keyed lake handle cannot be constructed — a key is
# never silently ignored, and an encrypted lake reports a clear build hint
# instead of a parse error.
encryption = ["dep:aes-gcm", "dep:sha2", "pinkdb/encryption"]
# Opt-in SQL catalog store (wave 96a): a lake's DuckLake metadata lives in one
# SQLite file while its data files stay on local disk or S3 — DuckLake's
# catalog/data-path split. `bundled` compiles SQLite in, so no system library
# is needed (the musl Docker image works). Without this feature a `sqlite:`
# location is a clear `FeatureMissing` naming the rebuild flag.
catalog-sqlite = ["dep:rusqlite"]
# Opt-in Postgres catalog store (wave 96a): the same split-catalog semantics as
# `catalog-sqlite`, over a `postgres://` / `postgresql://` URL (one lake per
# schema, `?schema=<name>`). TLS is rustls with the ring provider the workspace
# already uses, so the dependency graph adds no second crypto stack. Without
# this feature a `postgres://` location is a clear `FeatureMissing` naming the
# rebuild flag.
catalog-postgres = [
    "dep:postgres",
    "dep:rustls",
    "dep:tokio-postgres-rustls",
    "dep:webpki-roots",
]

[dependencies]
pinkdb = { path = "../pinkdb" }
# Metadata only: the catalog/snapshot JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S3 storage (`s3` feature): the shared blocking HTTP/SigV4 client (rustls,
# no aws-sdk, no async runtime).
pinkdb-httpfs = { path = "../pinkdb-httpfs", optional = true }
# OS randomness for the 128-bit lake id (M-7). Same version as the engine's
# password-salt source; no new crate enters the lockfile.
getrandom = "0.2"
# At-rest encryption (`encryption` feature): the same audited RustCrypto
# AES-256-GCM as `pinkdb/encryption`.
aes-gcm = { version = "0.10", optional = true }
# Nonce derivation from the per-container 128-bit random base (L-4).
sha2 = { version = "0.10", optional = true }
# The SQLite catalog store (`catalog-sqlite`): the SQL half of a split lake.
# `bundled` builds SQLite from source so no system library is involved.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
# The Postgres catalog store (`catalog-postgres`): the synchronous client (its
# own small tokio runtime is internal, no async runtime leaks into the lake).
# TLS goes through rustls + ring + the webpki roots the workspace already
# locks, so `catalog-postgres` adds no second TLS stack.
postgres = { version = "0.19", optional = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"], optional = true }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"], optional = true }
webpki-roots = { version = "1", optional = true }
