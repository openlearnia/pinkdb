[package]
name = "pink-lake"
version = "0.1.0"
edition = "2021"
description = "pink-lake: the minimal pinkdb lake layer — a JSON catalog + immutable per-table columnar data files on local disk"
license = "MIT"

[dependencies]
pinkdb = { path = "../pinkdb" }
# Metadata only: the catalog/snapshot JSON. Data files are the engine's own
# `.pink` persistence bytes, so no format code is added here.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
