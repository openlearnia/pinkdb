[package]
name = "pink-lake"
version = "0.1.0"
edition = "2024"
# The workspace MSRV: 1.97 (vortex 0.88's own floor was 1.95).
rust-version = "1.97"
description = "pink-lake: the minimal pinkdb lake layer — a JSON catalog + immutable per-table data files on local disk (Vortex with the `vortexlake` feature, v1 `.pink` data files without it)"
license = "MIT"

[features]
default = []
# Opt-in Vortex data files (catalog format_version 2/3, the format the
# `vortexlake` CLI builds write): one Vortex file per table through the
# `vortex` facade (arrays + the file writer/reader with builtin codecs), with
# the attach fast paths. Without this feature a build reads and writes only
# the v1 `.pink` data-file format (catalog format_version 1) and pulls no
# Vortex dependency — the `pinklake` CLI builds.
vortexlake = ["dep:vortex", "dep:rayon"]
# Opt-in object storage: `s3://bucket/prefix` lake locations over the S3 REST
# API (AWS S3, Cloudflare R2, MinIO, …). Since wave 75 the SigV4 client lives
# in the shared `pinkdb-httpfs` crate (also the engine's remote-file
# transport); this feature forwards to its `s3` half.
s3 = ["dep:pinkdb-httpfs", "pinkdb-httpfs/s3"]
# Opt-in at-rest encryption (`PNKLAKE1` containers: catalog, snapshots, commit
# deltas, data files, delete files). Audited RustCrypto crates only (the same
# AES-256-GCM + Argon2id the engine's `pinkdb/encryption` uses). Without the
# feature a keyed lake handle cannot be constructed — a key is never silently
# ignored, and an encrypted lake reports a clear build hint instead of a
# parse error.
encryption = ["dep:aes-gcm", "dep:argon2"]

[dependencies]
pinkdb = { path = "../pinkdb" }
# Metadata only: the catalog/snapshot JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S3 storage (`s3` feature): the shared blocking HTTP/SigV4 client (rustls,
# no aws-sdk, no async runtime).
pinkdb-httpfs = { path = "../pinkdb-httpfs", optional = true }
# The `vortexlake` data format (v2/v3 lakes): one Vortex file per table,
# written through the `vortex` facade. `default-features = false,
# features = ["files"]` drops the wasm-bindgen/tensor/parquet-variant extras
# and the zstd codec — the builtin Vortex encodings are still registered by
# `VortexSession::default()`.
vortex = { version = "0.88.0", default-features = false, features = ["files"], optional = true }
# Parallel engine→Vortex chunk conversion and data-file decode
# (`vortexlake` only).
rayon = { version = "1.12.0", optional = true }
# At-rest encryption (`encryption` feature): the same audited RustCrypto
# crates and versions as `pinkdb/encryption` (AES-256-GCM, Argon2id).
aes-gcm = { version = "0.10", optional = true }
argon2 = { version = "0.5", optional = true }
