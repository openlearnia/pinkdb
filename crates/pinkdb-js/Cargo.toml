[package]
name = "pinkdb-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "pinkdb: the deterministic JavaScript procedure sandbox (optional `js` feature)"
license = "MIT"

[lib]
crate-type = ["rlib"]

# The contract alone has no dependencies. The `engine` feature binds
# quickjs-ng through `rquickjs` (vendored C sources compiled with `cc`; no
# bindgen), and `pinkdb`'s `js` feature turns it on — the default pinkdb
# build links nothing here.
[features]
engine = ["dep:rquickjs"]

[dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std"], optional = true }
