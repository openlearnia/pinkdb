[workspace]
members = [
    "crates/pinkdb",
    "crates/pinkdb-cli",
    "crates/pinkdb-server",
    # Wave 78: the server's warehouse browsing UI (a read-only web console).
    # A sibling of `pinkdb-server`, pulled in by that crate's optional `ui`
    # feature, so the default server binary stays exactly as it was.
    "crates/pinkdb-server-ui",
    "crates/pinkdb-ffi",
    "crates/pinkdb-ext-loader",
    "crates/pinkdb-js",
    "crates/pink-lake",
    # The Rust extension SDK (wave 51) and its worked example. Neither is a
    # dependency of any pinkdb binary: the SDK depends on the loader, never
    # the other way around.
    "ext-sdk/rust",
    "ext-sdk/rust/example/string_ext",
    # In-repo first-party extensions (waves 52–56): built as cdylibs loaded
    # with `LOAD EXTENSION '<path>'` (and mirrored by the linked/wasm
    # registration).
    "extensions/json",
    "extensions/string",
    "extensions/datetime",
    # Core math extension (wave 54): the DuckDB math surface the engine does
    # not already provide, authored with the SDK's linked registration.
    "extensions/math",
    # Core arrow extension (wave 71): Arrow IPC file read/write. Engine-adjacent
    # (it depends on `pinkdb` and implements the host table-source and COPY-sink
    # hooks); the CLI wires it behind the opt-in `arrow` feature.
    "extensions/arrow",
    # Core parquet extension (wave 70): read-side Parquet, the same
    # engine-adjacent shape, wired behind the CLI's opt-in `parquet` feature.
    "extensions/parquet",
    # Shared remote-file transport + `read_csv` table source (wave 75):
    # https GET/range and the SigV4 S3 client pink-lake's `s3` feature uses.
    "crates/pinkdb-httpfs",
]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependency debug info is the bulk of target/debug once a large tree like
# vortex is in play; keep our own crates debuggable, strip deps.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
