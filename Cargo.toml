[workspace]
members = [
    "crates/pinkdb",
    "crates/pinkdb-cli",
    "crates/pinkdb-server",
    "crates/pinkdb-ffi",
    "crates/pinkdb-ext-loader",
    "crates/pinkdb-js",
    "crates/pink-lake",
]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependency debug info is the bulk of target/debug once a large tree like
# vortex is in play; keep our own crates debuggable, strip deps.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
