[workspace]
members = [
    "crates/pinkdb",
    "crates/pinkdb-cli",
    "crates/pinkdb-server",
    # Wave 78: the server's warehouse browsing UI (a read-only web console).
    # A sibling of `pinkdb-server`, pulled in by that crate's optional `ui`
    # feature, so the default server binary stays exactly as it was.
    "crates/pinkdb-server-ui",
    "crates/pinkdb-ffi",
    "crates/pinkdb-ext-loader",
    "crates/pinkdb-js",
    "crates/pink-lake",
    # Wave 87: the Parquet lake format provider (the LakeFormat bridge over
    # the parquet extension's reader/writer). Depends on pink-lake and
    # pinkdb-parquet, never the other way around.
    "crates/pink-lake-parquet",
    # The Rust extension SDK (wave 51) and its worked example. Neither is a
    # dependency of any pinkdb binary: the SDK depends on the loader, never
    # the other way around.
    "ext-sdk/rust",
    "ext-sdk/rust/example/string_ext",
    # The ABI conformance fixture (ext-sdk/conformance/README.md): the same
    # contract as the C, C++, Go and Rust SDKs, measured through the Rust SDK.
    "ext-sdk/rust/conformance",
    # In-repo first-party extensions (waves 52–56): built as cdylibs loaded
    # with `LOAD EXTENSION '<path>'` (and mirrored by the linked/wasm
    # registration).
    "extensions/json",
    "extensions/string",
    "extensions/datetime",
    # Core math extension (wave 54): the DuckDB math surface the engine does
    # not already provide, authored with the SDK's linked registration.
    "extensions/math",
    # Core full-text search extension (wave 108a): a DuckDB-fts-compatible BM25
    # index. Engine-adjacent like arrow/parquet: the index tables are ordinary
    # tables, so the extension needs the package host hooks. Wired behind the
    # CLI's opt-in `fts` feature.
    "extensions/fts",
    # Vector similarity search (wave 107b): HNSW indexes for ARRAY columns,
    # attached through the engine's vector-index provider hook. Wired behind
    # the CLI/server opt-in `vss` feature.
    "extensions/vss",
    # Core arrow extension (wave 71): Arrow IPC file read/write. Engine-adjacent
    # (it depends on `pinkdb` and implements the host table-source and COPY-sink
    # hooks); the CLI wires it behind the opt-in `arrow` feature.
    "extensions/arrow",
    # Core parquet extension (wave 70): read-side Parquet, the same
    # engine-adjacent shape, wired behind the CLI's opt-in `parquet` feature.
    "extensions/parquet",
    # Core iceberg extension (wave 72): read-side Iceberg v2 tables — metadata
    # and Avro manifests resolved here, data files read by the parquet reader.
    # Opt-in like the rest (`iceberg` feature, which turns on `parquet`).
    "extensions/iceberg",
    # The MCP bridge (wave 105): an agent's client talks to this cdylib over
    # stdio or loopback HTTP; it is loaded, never linked, so no pinkdb binary
    # grows beyond the small host-side ABI addition.
    "extensions/mcp",
    # The MCP wire the bridge and agent memory share (wave 109): JSON-RPC 2.0,
    # the tool table trait, stdio and loopback HTTP. An rlib, never loaded.
    "extensions/mcp-protocol",
    # The warehouse tool set (wave 106) the MCP bridge and the agent extension
    # both expose: one set of JSON Schemas and one statement planner, so the
    # two surfaces cannot drift.
    "extensions/warehouse-tools",
    # The data agent (wave 106): an LLM loop whose whole state lives in the
    # store. Loaded like the MCP bridge, never linked.
    "extensions/agent",
    # Agent memory (wave 109): L0 turns, L1 atoms, L2 scenarios and L3
    # personas, distilled through the shared model client and read back
    # layered and budgeted. Loaded like the agent, never linked.
    "extensions/memory",
    # The shared model client (wave 106b): the provider-neutral transcript, the
    # provider registry and the OpenAI and Anthropic wire protocols. An rlib
    # linked into an extension (the agent now, agent memory next), never loaded
    # on its own, and the only owner of the agent-side `ureq` dependency.
    "extensions/llm",
    # The embeddings extension (wave 107c): `embed(text)` turns text into a
    # `FLOAT[N]` array from an OpenAI-compatible endpoint. Engine-adjacent
    # like fts (it needs the package host hooks), opt-in behind the CLI's
    # `embeddings` feature, and external I/O the server policy gates.
    "extensions/embeddings",
    # Shared remote-file transport + `read_csv` table source (wave 75):
    # https GET/range and the SigV4 S3 client pink-lake's `s3` feature uses.
    "crates/pinkdb-httpfs",
    # Browser playground (wave 85): the wasm32-unknown-unknown ABI over the
    # engine, a cdylib loaded by the docs site's playground.
    "crates/pinkdb-wasm",
]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependency debug info is the bulk of target/debug once a large tree like
# large dependencies are in play; keep our own crates debuggable, strip deps.
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
